<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aventurero - Spring Boot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        h1  { color: #f0c040; font-size: 2em; }
        p   { font-size: 1.2em; }
        .caja {
            display: inline-block;
            border: 2px solid #4a90d9;
            border-radius: 12px;
            padding: 30px 60px;
            margin-top: 20px;
            text-align: left;
        }
        .etiqueta { color: #4a90d9; font-weight: bold; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Ficha del Aventurero</h1>
        <p><span class="etiqueta">Aventurero:</span> <span th:text="${aventurero.nombre}">Nombre</span></p>
        <p><span class="etiqueta">Clase:</span> <span th:text="${aventurero.clase}">Clase</span></p>
        <p><span class="etiqueta">Nivel:</span> <strong th:text="${aventurero.nivel}">0</strong></p>
    </div>
</body>
</html>
