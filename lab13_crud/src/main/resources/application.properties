spring.application.name=agenda-web

# Conexión a MySQL
# allowPublicKeyRetrieval=true es necesario con MySQL 8 (caching_sha2_password) cuando useSSL=false;
# sin él la app falla al arrancar con "Public Key Retrieval is not allowed"
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Monterrey
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# La contraseña se lee de la variable de entorno MYSQL_PASSWORD para no subirla al repositorio
# (export MYSQL_PASSWORD=tu_password antes de correr la app)
spring.datasource.password=${MYSQL_PASSWORD:TU_PASSWORD_AQUI}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
