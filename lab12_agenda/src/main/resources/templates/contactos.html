<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contactos</title>
    <style>
        body   { font-family: Arial, sans-serif; background: #1a1a2e;
                 color: #e0e0e0; display: flex; justify-content: center;
                 margin-top: 60px; }
        .caja  { background: #16213e; padding: 40px; border-radius: 12px;
                 border: 1px solid #4a90d9; min-width: 640px; }
        .encabezado { display: flex; justify-content: space-between;
                      align-items: center; margin-bottom: 24px; }
        h1     { color: #f0c040; margin: 0; }
        .boton { padding: 10px 16px; background: #4a90d9; border: none;
                 border-radius: 6px; color: white; text-decoration: none;
                 font-size: .9em; cursor: pointer; }
        .peligro { background: #d94a4a; }
        table  { width: 100%; border-collapse: collapse; }
        th     { color: #4a90d9; text-align: left; padding: 10px;
                 border-bottom: 2px solid #4a90d9; }
        td     { padding: 10px; border-bottom: 1px solid #0f3460; }
        tr:hover td { background: #0f3460; }
        .acciones { display: flex; gap: 8px; }
        .acciones form { margin: 0; }
        .vacio { text-align: center; color: #aaa; padding: 30px 0; }
    </style>
</head>
<body>
    <div class="caja">
        <div class="encabezado">
            <h1>📋 Agenda de Contactos</h1>
            <a class="boton" th:href="@{/nuevo}">+ Nuevo contacto</a>
        </div>

        <p class="vacio" th:if="${#lists.isEmpty(contactos)}">
            No hay contactos todavía. ¡Agrega el primero!
        </p>

        <table th:unless="${#lists.isEmpty(contactos)}">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${contactos}">
                    <td th:text="${c.nombre}">-</td>
                    <td th:text="${c.apellido}">-</td>
                    <td th:text="${c.email}">-</td>
                    <td th:text="${c.telefono}">-</td>
                    <td class="acciones">
                        <a class="boton" th:href="@{/editar/{id}(id=${c.id})}">Editar</a>
                        <form th:action="@{/eliminar/{id}(id=${c.id})}" method="post"
                              onsubmit="return confirm('¿Eliminar este contacto?');">
                            <button type="submit" class="boton peligro">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
